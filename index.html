<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Snippet Manager | Made by Lumi</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div class="container">
        <header>
            <h1>💡 Code Snippet Manager</h1>
            <p class="subtitle">Save, organize, and search your code snippets</p>
            <button id="themeToggle" class="theme-toggle" title="Toggle Dark Mode">🌙</button>
        </header>

        <div class="app-layout">
            <!-- Sidebar with snippet list -->
            <aside class="sidebar">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="🔍 Search snippets...">
                </div>
                <div class="filter-tags">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="javascript">JavaScript</button>
                    <button class="filter-btn" data-filter="python">Python</button>
                    <button class="filter-btn" data-filter="html">HTML</button>
                    <button class="filter-btn" data-filter="css">CSS</button>
                    <button class="filter-btn" data-filter="sql">SQL</button>
                    <button class="filter-btn" data-filter="other">Other</button>
                </div>
                <div class="snippet-list" id="snippetList">
                    <!-- Snippets will be loaded here -->
                </div>
            </aside>

            <!-- Main editor area -->
            <main class="editor-area">
                <div class="editor-header">
                    <input type="text" id="snippetTitle" placeholder="Snippet title...">
                    <select id="snippetLanguage">
                        <option value="javascript">JavaScript</option>
                        <option value="python">Python</option>
                        <option value="html">HTML</option>
                        <option value="css">CSS</option>
                        <option value="sql">SQL</option>
                        <option value="bash">Bash</option>
                        <option value="json">JSON</option>
                        <option value="other">Other</option>
                    </select>
                    <input type="text" id="snippetTags" placeholder="Tags (comma separated)">
                </div>
                <textarea id="snippetCode" placeholder="// Paste your code here...
function example() {
    return 'Hello World!';
}"></textarea>
                <div class="editor-actions">
                    <button id="newSnippetBtn" class="secondary">➕ New Snippet</button>
                    <button id="saveSnippetBtn" class="primary">💾 Save Snippet</button>
                    <button id="copySnippetBtn" class="secondary">📋 Copy</button>
                    <button id="deleteSnippetBtn" class="danger">🗑️ Delete</button>
                </div>
                <div class="stats-bar">
                    <span id="charCount">0 chars</span>
                    <span id="lineCount">0 lines</span>
                    <span id="snippetCount">0 snippets</span>
                </div>
            </main>
        </div>

        <!-- Import/Export Modal -->
        <div id="modal" class="modal hidden">
            <div class="modal-content">
                <h3>Import/Export Snippets</h3>
                <textarea id="importExportArea" placeholder="Paste JSON here to import..."></textarea>
                <div class="modal-actions">
                    <button id="importBtn">📥 Import</button>
                    <button id="exportBtn">📤 Export All</button>
                    <button id="closeModalBtn" class="secondary">Close</button>
                </div>
            </div>
        </div>

        <footer>
            <div class="footer-actions">
                <button id="importExportToggle">📁 Import/Export</button>
                <button id="clearAllBtn" class="danger">⚠️ Clear All</button>
            </div>
            <p>Made with 💡 by <a href="https://github.com/Agent-Lumi" target="_blank">Lumi</a></p>
        </footer>
    </div>

    <div id="notification" class="notification hidden"></div>
    <script src="app.js"></script>
</body>
</html>
